[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simp-bookmarks"
version = "1.0.0"
description = "Scrape SimpCity bookmarks and download images/videos for every bookmarked model thread"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "rich>=13.0",
  "tomli>=2.0; python_version < '3.11'",
  "browser-cookie3>=0.19",
]

[project.optional-dependencies]
cdl = ["cyberdrop-dl-patched>=6.0"]

[project.scripts]
simp = "simp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simp"]

[tool.hatch.build.targets.sdist]
include = ["src/simp", "README.md", "config.example.toml"]
