# Copy to config.toml and edit.

[site]
# Primary forum origin. Mirrors rotate: .cr / .su / .is / etc.
base_url = "https://simpcity.cr"
user_agent = "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"

[auth]
# Netscape cookies.txt exported while logged into SimpCity (required).
# Chrome extension: "Get cookies.txt LOCALLY" / Firefox: "cookies.txt"
cookies_file = "cookies/simpcity.txt"

# Optional: pull cookies straight from a logged-in browser profile instead.
# browser = "firefox"   # firefox | chrome | chromium | brave | edge
# browser_profile = "default"

[paths]
download_dir = "downloads"
state_dir = "state"
# cyberdrop-dl db/cache/logs — kept inside the project (not ~/.local)
cdl_dir = "state/cdl"
# Verification staging for cyberdrop-dl. Empty = a sibling of the library
# named .<library-name>.simp-incoming on the same drive. Must be outside the
# library and on the same filesystem; the library's parent must be writable.
cdl_staging_dir = ""
urls_export = "state/bookmark_urls.txt"
media_export = "state/media_urls.txt"
# Optional: whereto.txt with one path → <path>/<models_subdir>/<model>/
# Set models_subdir = "" to put models directly under the whereto path.
whereto_file = "whereto.txt"
models_subdir = ""

[scrape]
# Pause between page fetches (seconds). Be kind to the forum.
# Post→thread resolves also pace at least this slow (avoids 429 bans).
delay_min = 2.0
delay_max = 4.0
# Max concurrent host downloads (direct fallback only).
concurrency = 2
# Forum pages in flight at once (1-4, default 2). Page starts still obey the
# delay above; slow responses can overlap. Set 1 for sequential crawling.
page_concurrency = 2
# Also scrape Watched Threads in addition to Bookmarks.
include_watched = false
# Skip threads whose title matches any of these (case-insensitive substrings).
skip_title_contains = []
# Only keep thread URLs that look like model threads (usually /threads/...).
thread_url_must_contain = "/threads/"

[download]
# Keep one exact copy per model, comparing SHA-256 of complete photos/videos.
# A new URL must first transfer to a temporary file; known URLs skip immediately.
# Different encodings/resolutions are different files. No old files are removed.
deduplicate = true
# Hand discovered host URLs to cyberdrop-dl-patched when available.
use_cyberdrop_dl = true
cyberdrop_dl_bin = "cyberdrop-dl"
# Always also try the built-in direct downloader for forum attachments
# and simple image hosts (jpg*, pixhost, imgbox, attachments, etc.).
use_direct = true
# File types to keep.
images = true
videos = true
# Skip known URLs without requesting them. False also disables content dedupe
# for deliberate re-downloads. With deduplicate=true, names/sizes alone never
# prove two new links identical.
skip_existing = true
# Never download these extensions (direct + cyberdrop-dl). [] = keep everything.
exclude_extensions = [".zip", ".rar", ".7z", ".tar", ".gz", ".tgz", ".bz2", ".xz", ".cab", ".iso"]
# Direct downloads the index remembers but whose file is gone: fetch again
# (true) or leave them gone (false). On the server this is false, because
# Edging Heaven deletes files by moving them to .heaven-trash.
redownload_missing = true
# Skip files bigger than this many bytes (direct + cyberdrop-dl). 0 = no limit.
# Direct downloads also enforce this while streaming unknown/compressed sizes.
# FAT32 cannot hold a file of 4 GiB or more: use 4294967295 there.
max_file_bytes = 0
# Stop before the drive gets fuller than this: simp and cyberdrop-dl leave this
# many bytes free (0 = no reserve). A job that reaches it stops cleanly (exit 3,
# nothing half-written kept) and the next run continues. The server keeps 3 GiB.
min_free_bytes = 0
